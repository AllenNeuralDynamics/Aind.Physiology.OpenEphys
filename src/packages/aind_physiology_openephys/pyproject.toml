[build-system]
requires = ["uv_build>=0.8.4,<0.9"]
build-backend = "uv_build"

[project]
name = "aind-physiology-openephys"
description = "A library for the AIND Open Ephys physiology rig."
authors = [{name = "Bruno Cruz", email = "bruno.cruz@alleninstitute.org"}]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
version = "0.1.0"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
    "aind-behavior-services>=0.13.9",
    "aind-clabe",
    "pydantic",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/Aind.Physiology.OpenEphys/"
Issues = "https://github.com/AllenNeuralDynamics/Aind.Physiology.OpenEphys/issues"
Changelog = "https://github.com/AllenNeuralDynamics/Aind.Physiology.OpenEphys/releases"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["ruff", "codespell", "pytest", "pytest-cov"]

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,uv.lock'
ignore-words-list = 'nd'

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
